[package]
name = "atep-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "ATEP core library: quantum-safe (hybrid Ed25519 + ML-DSA-65, X25519 + ML-KEM-768) signed and encrypted envelopes with offline identification (experimental alpha, ATEP Draft 08)"
readme = "README.md"
documentation = "https://docs.rs/atep-core"
keywords = ["atep", "post-quantum", "cose", "robotics", "attestation"]
categories = ["cryptography", "authentication", "encoding"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "atep_core"
path = "src/lib.rs"

[[bin]]
name = "atep-vectors"
path = "src/bin/atep-vectors.rs"

[dependencies]
ml-dsa = { version = "0.1.1", features = ["zeroize"] }
ml-kem = { version = "0.3.2", features = ["zeroize"] }
ed25519-dalek = "3.0.0"
x25519-dalek = "3.0.0"
aes-gcm = "0.11.1"
hkdf = "0.13.0"
sha2 = "0.11.0"
zeroize = { version = "1.9.0", features = ["derive"] }
base32 = "1.0.0-rc.1"
hex = "0.4.3"
base64 = "0.23.1"
rand_core = "0.10.1"
getrandom = "0.4.3"
serde_json = { version = "1", features = ["preserve_order"] }
