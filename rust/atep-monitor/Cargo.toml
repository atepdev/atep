[package]
name = "atep-monitor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "ATEP log monitor (ATEP Draft 07)"
publish = false

[lib]
name = "atep_monitor"
path = "src/lib.rs"

[[bin]]
name = "atep-monitor"
path = "src/main.rs"

[dependencies]
atep-core = { version = "0.1.0-alpha.2", path = "../atep-core" }
atep-log = { version = "0.1.0-alpha.2", path = "../atep-log" }
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
base64 = "0.23.1"
serde_json = { version = "1", features = ["preserve_order"] }
