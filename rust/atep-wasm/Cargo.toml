[package]
name = "atep-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "WebAssembly bindings for atep-core (the @atep/core npm package)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
atep-core = { version = "0.1.0-alpha.3", path = "../atep-core" }
wasm-bindgen = "=0.2.129"
serde_json = { version = "1", features = ["preserve_order"] }
hex = "0.4.3"
zeroize = "1.9.0"
# Turns on the browser/Node randomness backend of getrandom for wasm32
# (Cargo feature unification applies it to atep-core's getrandom too).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
