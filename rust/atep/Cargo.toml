[package]
name = "atep"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "ATEP: quantum-safe (hybrid Ed25519 + ML-DSA-65, X25519 + ML-KEM-768) signed and encrypted envelopes with offline identification; re-exports atep-core (experimental alpha)"
readme = "README.md"
documentation = "https://docs.rs/atep"
keywords = ["atep", "post-quantum", "cose", "robotics", "attestation"]
categories = ["cryptography", "authentication", "encoding"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "atep"
path = "src/lib.rs"

[dependencies]
atep-core = { version = "0.1.0-alpha.2", path = "../atep-core" }
