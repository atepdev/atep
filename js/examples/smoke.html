<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>@atep/core smoke test</title>
  <style>
    body { font: 14px/1.4 ui-monospace, monospace; margin: 2rem; max-width: 100%; }
    .ok { color: #070; } .fail { color: #b00; }
    pre { white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h1>@atep/core smoke test</h1>
  <p>Serve the package root (<code>npm run smoke</code>) and open this page. It loads the wasm over fetch, generates two identities, signs, encrypts, decrypts and verifies.</p>
  <pre id="log">running...</pre>
  <script type="module">
    import { init, keygen, sign, encrypt, verify } from "../dist/index.js";
    const log = document.getElementById("log");
    const lines = [];
    const say = (s) => { lines.push(s); log.textContent = lines.join("\n"); };
    try {
      const t0 = performance.now();
      await init(); // fetches dist/wasm/atep_wasm_bg.wasm
      say(`wasm loaded in ${(performance.now() - t0).toFixed(1)} ms`);

      const alice = keygen(false);
      const bob = keygen(true);
      say(`alice: ${alice.agentId}`);
      say(`bob:   ${bob.agentId}`);

      const now = Math.floor(Date.now() / 1000);
      const signed = sign(alice, new TextEncoder().encode("hello from the browser"), { issuedAt: now });
      const sealed = encrypt(signed, bob.publicBundle);
      say(`signed envelope ${signed.length} bytes, encrypted ${sealed.length} bytes`);

      const t1 = performance.now();
      const r = verify(sealed, {}, { recipient: bob, now });
      say(`verify: ${JSON.stringify({ ok: r.ok, signer: r.signer, encrypted: r.encrypted })} in ${(performance.now() - t1).toFixed(1)} ms`);
      const text = new TextDecoder().decode(Uint8Array.from(r.payload_hex.match(/../g).map((h) => parseInt(h, 16))));
      say(`payload: ${text}`);
      if (!r.ok || r.signer !== alice.agentId) throw new Error("verification failed");
      log.className = "ok";
      say("PASS");
    } catch (e) {
      log.className = "fail";
      say(`FAIL: ${e && e.stack || e}`);
    }
  </script>
</body>
</html>
